name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'android/**'
      - 'package.json'
      - 'src/web/**'
      - 'tests/e2e/server.ts'
      - 'tests/setup.ts'
      - 'tests/fixtures.ts'
      - 'package-lock.json'
      - 'src/shared/**'
      - 'src/server/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'package.json'
      - 'src/web/**'
      - 'tests/e2e/server.ts'
      - 'tests/setup.ts'
      - 'tests/fixtures.ts'
      - 'package-lock.json'
      - 'src/shared/**'
      - 'src/server/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify and assemble
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Prepare APKs and checksums
        id: apk
        run: |
          version="$(python3 -c 'import json; print(json.load(open("../package.json"))["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p build/artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "build/artifacts/litera-$version-debug.apk"
          cd build/artifacts
          sha256sum *.apk > SHA256SUMS
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: litera-android-${{ steps.apk.outputs.version }}-debug-${{ github.sha }}
          path: android/build/artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: litera-android-reports-${{ github.sha }}
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 14

  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Build the production PWA and prepare real server fixtures
        working-directory: .
        run: |
          npm ci
          npm run build
          node --import tsx tests/e2e/server.ts > "$RUNNER_TEMP/litera-pwa.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/litera-pwa.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3107/health > /dev/null; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/litera-pwa.log"
          exit 1
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: WebView host and real PWA on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: |
            adb reverse tcp:3107 tcp:3107
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.literaServer=http://localhost:3107
      - name: Upload device reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: litera-android-device-reports-${{ github.sha }}
          path: |
            android/app/build/outputs/connected_android_test_additional_output/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            ${{ runner.temp }}/litera-pwa.log
          retention-days: 14
      - name: Stop fixture server
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/litera-pwa.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/litera-pwa.pid")" 2>/dev/null || true
          fi
