name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'android/**'
      - 'package.json'
      - 'src/shared/**'
      - 'src/server/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - 'package.json'
      - 'src/shared/**'
      - 'src/server/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify and assemble
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Prepare APKs and checksums
        id: apk
        run: |
          version="$(python3 -c 'import json; print(json.load(open("../package.json"))["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p build/artifacts
          cp app/build/outputs/apk/debug/app-debug.apk "build/artifacts/litera-$version-debug.apk"
          cd build/artifacts
          sha256sum *.apk > SHA256SUMS
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: litera-android-${{ steps.apk.outputs.version }}-debug-${{ github.sha }}
          path: android/build/artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: litera-android-reports-${{ github.sha }}
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 14

  emulator-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Native smoke on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Upload device reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: litera-android-device-reports-${{ github.sha }}
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          retention-days: 14
