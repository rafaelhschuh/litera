name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        suite: [checks, readers, offline-webkit]
        # Keep this version equal to @playwright/test in package-lock.json.
        playwright: ['1.62.1']
    container:
      image: mcr.microsoft.com/playwright:v${{ matrix.playwright }}-noble
      options: --ipc=host
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PLAYWRIGHT_CI_VERSION: ${{ matrix.playwright }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check browser image version
        run: |
          node -e 'const v = require("./package-lock.json").packages["node_modules/@playwright/test"].version; if (v !== process.env.PLAYWRIGHT_CI_VERSION) throw new Error("Update the CI Playwright image to " + v)'
      - run: npm ci
      - name: Prepare unprivileged validation user
        # Root bypasses chmod-based read-only checks. Keep Actions setup as root,
        # but run the application, builds and suites as the image's normal user.
        run: |
          chown -R pwuser:pwuser "$GITHUB_WORKSPACE"
          runuser -u pwuser -- env "PATH=$PATH" sh -ec 'test "$(id -u)" -ne 0; test -w .; test -w "$HOME"'
      - name: Lint, types and unit/integration tests
        if: matrix.suite == 'checks'
        run: |
          runuser -u pwuser -- env "PATH=$PATH" sh -ec '
            npm run lint
            npm run typecheck
            npm test -- --maxWorkers=2
          '
      - name: Production build and reader E2E — desktop/mobile
        if: matrix.suite == 'readers'
        run: |
          runuser -u pwuser -- env "PATH=$PATH" sh -ec '
            npm run build
            npm run test:e2e -- --project=chromium --project=chromium-mobile --max-failures=3
          '
      - name: Offline storage and sync — WebKit
        if: matrix.suite == 'offline-webkit'
        run: runuser -u pwuser -- env "PATH=$PATH" LITERA_STORAGE_BROWSER=webkit npm test -- tests/offline-store.test.ts tests/offline-sync.test.ts --hookTimeout=30000 --maxWorkers=1
      - name: Upload failed reader diagnostics
        if: failure() && matrix.suite == 'readers'
        uses: actions/upload-artifact@v4
        with:
          name: reader-failure-${{ github.run_id }}
          path: test-results/
          retention-days: 7

  container-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha,scope=litera-web

  # Preserve the existing CI / verify check for branch protection.
  verify:
    if: always()
    needs: [checks, container-check]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every validation suite
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
          CONTAINER_RESULT: ${{ needs.container-check.result }}
        run: |
          test "$CHECK_RESULT" = success
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then test "$CONTAINER_RESULT" = success; fi

  publish:
    if: ${{ !cancelled() && needs.verify.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build once and publish the validated commit
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/rafaelhschuh/litera:main
            ghcr.io/rafaelhschuh/litera:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=litera-web
          cache-to: type=gha,mode=max,scope=litera-web
