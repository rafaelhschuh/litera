services:
  litera:
    image: ghcr.io/rafaelhschuh/litera:0.4.0
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      LITERA_DATA_DIR: "/data"
      LITERA_BOOK_ROOTS: "/books"
      LITERA_ADMIN_USERNAME: "admin"
      LITERA_ADMIN_PASSWORD: "CHANGE_ME_BEFORE_DEPLOY"
      LITERA_SECURE_COOKIES: "false"
      LITERA_PUBLIC_ORIGIN: "http://localhost:3000"
      LITERA_OPENLIBRARY_ENABLED: "false"
      LITERA_OPENLIBRARY_CONTACT: ""
      LITERA_MAX_BOOK_MB: "512"
      LITERA_BUILD: "0.4.0"
    volumes:
      - litera_data:/data
      - ./books:/books:ro
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

volumes:
  litera_data:
